<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>习听云FM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-base sm:text-lg md:text-xl font-bold text-blue-600 shrink-0 whitespace-nowrap">🎧 习听云FM<span class="hidden sm:inline text-xs font-normal text-gray-400 ml-1.5 shrink-0">让每日聆听成为习惯</span></a>
                </div>
                <div class="flex items-center space-x-2 sm:space-x-3">
                    <div class="flex items-center space-x-2 sm:space-x-3 overflow-x-auto no-scrollbar">
                        <a href="/progress.html" class="text-gray-600 hover:text-blue-600 text-xs sm:text-sm whitespace-nowrap">我的学习</a>
                        <a href="/favorites.html" class="text-gray-600 hover:text-blue-600 text-xs sm:text-sm whitespace-nowrap">我的收藏</a>
                        <a href="/analyze.html" class="text-gray-600 hover:text-blue-600 text-xs sm:text-sm whitespace-nowrap">学习分析</a>
                    </div>
                    <div id="nav-user"></div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- 品牌标语 -->
        <div class="text-center mb-6">
            <p class="text-gray-400 text-sm tracking-wider">让每日聆听成为习惯</p>
        </div>

        <!-- 继续学习 -->
        <div id="continue-learning" class="hidden"></div>

        <!-- 搜索栏 -->
        <div class="mb-8">
            <div class="relative max-w-xl mx-auto">
                <input type="text" id="search-input" placeholder="搜索课程..."
                       class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white shadow-sm">
                <svg class="absolute left-3 top-3.5 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
            </div>
        </div>

        <!-- 分类筛选 -->
        <div class="mb-6" id="category-filters"></div>

        <!-- 课程列表 -->
        <div id="course-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/app.js"></script>

</body>
</html>
