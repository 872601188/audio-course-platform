<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 音频学习平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="/" class="text-xl font-bold text-blue-600">🎧 音频学习平台</a>
                <div class="flex items-center space-x-4">
                    <span class="text-gray-600 text-sm">管理后台</span>
                    <div id="nav-user"></div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- 课程管理 -->
        <section class="mb-12">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold text-gray-800">📚 课程管理</h2>
                <button onclick="showCourseModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
                    + 新建课程
                </button>
            </div>

            <!-- 课程列表 -->
            <div id="admin-course-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="text-gray-400 text-center py-10">加载中...</div>
            </div>
        </section>

        <!-- 批量上传 -->
        <section class="mb-12">
            <h2 class="text-xl font-bold text-gray-800 mb-6">⬆️ 批量上传音频</h2>
            <div class="bg-white rounded-xl shadow-sm p-6">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">选择课程</label>
                    <select id="upload-course-select" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">-- 请先选择课程 --</option>
                    </select>
                </div>

                <!-- 上传区域 -->
                <div id="drop-zone" class="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center hover:border-blue-500 hover:bg-blue-50 transition cursor-pointer hidden md:block">
                    <svg class="w-12 h-12 text-gray-400 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                    </svg>
                    <p class="text-gray-500 mb-1">拖拽音频文件到这里</p>
                    <p class="text-gray-400 text-sm">或点击选择多个文件</p>
                    <input type="file" id="file-input-desktop" multiple accept="audio/*" class="hidden">
                </div>

                <!-- 移动端上传：每次单选，多次累积 -->
                <div class="md:hidden">
                    <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 text-center mb-3">
                        <p class="text-blue-800 font-medium mb-1">📱 移动端批量上传</p>
                        <p class="text-blue-600 text-sm">每次选择一个文件，可多次添加</p>
                    </div>
                    <div class="flex flex-wrap gap-2 mb-3">
                        <button id="mobile-add-btn" 
                                class="flex-1 bg-blue-600 text-white px-4 py-3 rounded-lg hover:bg-blue-700 transition text-sm font-medium">
                            + 选择音频文件
                        </button>
                        <button onclick="clearAllFiles()" id="clear-btn" class="hidden px-4 py-3 border border-red-300 text-red-600 rounded-lg hover:bg-red-50 text-sm">
                            清空
                        </button>
                    </div>
                    <p class="text-gray-400 text-xs text-center">支持 MP3, WAV, OGG, M4A, FLAC, AAC</p>
                </div>

                <!-- 选中文件列表 -->
                <div id="file-list" class="mt-4 space-y-2 hidden">
                    <h4 class="font-medium text-gray-700 mb-2">待上传文件：</h4>
                    <div id="file-items" class="space-y-2"></div>
                    <button onclick="uploadFiles()" class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 transition mt-4">
                        开始上传
                    </button>
                </div>

                <div id="upload-progress-area" class="mt-4 hidden">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm font-medium text-gray-700">上传进度</span>
                        <span id="upload-progress-text" class="text-sm text-gray-500">0%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
                        <div id="upload-progress-bar" class="bg-blue-600 h-3 rounded-full transition-all duration-200" style="width: 0%"></div>
                    </div>
                    <div class="flex justify-between mt-1">
                        <span id="upload-speed" class="text-xs text-gray-400"></span>
                        <span id="upload-file-info" class="text-xs text-gray-400"></span>
                    </div>
                </div>

                <div id="upload-result" class="mt-4 hidden"></div>
            </div>
        </section>

        <!-- 管理提示 -->
        <section class="mb-12">
            <div class="bg-blue-50 border border-blue-200 rounded-xl p-4">
                <p class="text-sm text-blue-800">
                    💡 OpenClaw Token 管理已移至 <a href="/settings.html" class="underline font-medium">个人设置</a> 页面，每个用户可独立管理自己的 Token、有效期和权限。
                </p>
            </div>
        </section>
    </main>

    <!-- 课程模态框 -->
    <div id="course-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center">
        <div class="bg-white rounded-xl p-6 w-full max-w-lg mx-4 max-h-[90vh] overflow-y-auto">
            <h3 id="modal-title" class="text-lg font-bold mb-4">新建课程</h3>
            <form id="course-form" class="space-y-4">
                <input type="hidden" id="course-id">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">课程标题 *</label>
                    <input type="text" id="course-title-input" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">分类</label>
                    <input type="text" id="course-category-input" placeholder="如：编程、英语、设计" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">描述</label>
                    <textarea id="course-desc-input" rows="3" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">封面图片</label>
                    <input type="file" id="course-cover-input" accept="image/*" class="w-full px-3 py-2 border rounded-lg">
                    <img id="cover-preview" class="mt-2 max-h-40 rounded-lg hidden">
                </div>
                <div class="flex justify-end gap-3 pt-4">
                    <button type="button" onclick="closeCourseModal()" class="px-4 py-2 border rounded-lg hover:bg-gray-50">取消</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        let selectedFiles = [];
        let allCourses = [];

        document.addEventListener('DOMContentLoaded', () => {
            if (!requireAdmin()) return;
            loadAdminCourses();
            setupUpload();
        });

        // 加载课程列表
        async function loadAdminCourses() {
            try {
                const data = await CourseAPI.getList({ per_page: 100 });
                allCourses = data.courses || [];
                renderAdminCourses(allCourses);
                updateUploadCourseSelect(allCourses);
            } catch (err) {
                document.getElementById('admin-course-list').innerHTML = `<div class="text-red-500">${err.message}</div>`;
            }
        }

        function renderAdminCourses(courses) {
            const container = document.getElementById('admin-course-list');
            if (courses.length === 0) {
                container.innerHTML = '<div class="text-gray-400 text-center py-10">暂无课程，点击上方按钮创建</div>';
                return;
            }
            container.innerHTML = courses.map(c => `
                <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 hover:shadow-md transition" data-course-id="${c.id}">
                    <div class="flex items-start gap-3">
                        <img src="${c.cover_image || 'https://placehold.co/80x60/e5e7eb/9ca3af?text=Course'}" alt="" class="w-16 h-12 rounded object-cover flex-shrink-0">
                        <div class="flex-1 min-w-0">
                            <h4 class="font-medium text-gray-900 truncate">${c.title}</h4>
                            <span class="text-xs text-gray-500">${c.category}</span>
                            <p class="text-xs text-gray-400 mt-1">${c.audio_count || 0} 个音频 · ${formatDate(c.created_at)}</p>
                        </div>
                    </div>
                    <div class="flex gap-2 mt-3">
                        <button onclick="editCourse(${c.id})" class="text-xs px-3 py-1 bg-blue-50 text-blue-600 rounded hover:bg-blue-100">编辑</button>
                        <button onclick="deleteCourse(${c.id})" class="text-xs px-3 py-1 bg-red-50 text-red-600 rounded hover:bg-red-100">删除</button>
                        <a href="/player.html?course=${c.id}" class="text-xs px-3 py-1 bg-gray-50 text-gray-600 rounded hover:bg-gray-100">试听</a>
                    </div>
                    <!-- 音频文件列表 -->
                    <div class="mt-3 pt-3 border-t border-gray-100" id="audio-list-${c.id}">
                        <div class="flex items-center justify-between">
                            <span class="text-xs text-gray-500">${c.audio_count || 0} 个音频</span>
                            <button onclick="openAudioManager(${c.id}, '${c.title.replace(/'/g, "\\'")}')" class="text-xs px-2 py-1 bg-blue-50 text-blue-600 rounded hover:bg-blue-100 transition">
                                ⚙️ 管理音频
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 课程音频选中状态缓存: { courseId: Set(audioIds) }
        const audioSelection = {};
        let currentAudioManagerCourseId = null;

        // 打开音频管理弹窗
        async function openAudioManager(courseId, courseTitle) {
            currentAudioManagerCourseId = courseId;
            const modal = document.getElementById('audio-manager-modal');
            const titleEl = document.getElementById('audio-manager-title');
            const listEl = document.getElementById('audio-manager-list');
            const batchBtn = document.getElementById('audio-manager-batch-btn');
            const selectAllCb = document.getElementById('audio-manager-select-all');
            const countEl = document.getElementById('audio-manager-count');

            // 清空选中
            audioSelection[courseId] = new Set();
            selectAllCb.checked = false;
            batchBtn.disabled = true;
            batchBtn.textContent = '批量删除 (0)';
            batchBtn.classList.add('opacity-50');

            titleEl.textContent = courseTitle || '课程音频管理';
            listEl.innerHTML = '<div class="text-center py-8 text-gray-400">加载中...</div>';
            modal.classList.remove('hidden');

            try {
                const data = await CourseAPI.getDetail(courseId);
                const audios = data.course?.audio_files || [];
                countEl.textContent = `共 ${audios.length} 个音频`;

                if (audios.length === 0) {
                    listEl.innerHTML = '<div class="text-center py-8 text-gray-400">暂无音频文件</div>';
                    return;
                }

                renderAudioManagerList(courseId, audios);
            } catch (err) {
                listEl.innerHTML = `<div class="text-center py-8 text-red-500">加载失败: ${err.message}</div>`;
            }
        }

        // 关闭音频管理弹窗
        function closeAudioManager() {
            document.getElementById('audio-manager-modal').classList.add('hidden');
            currentAudioManagerCourseId = null;
        }

        // 渲染音频管理弹窗列表
        function renderAudioManagerList(courseId, audios) {
            const listEl = document.getElementById('audio-manager-list');
            const selected = audioSelection[courseId] || new Set();

            listEl.innerHTML = audios.map(a => `
                <div class="flex items-center gap-3 p-3 border-b border-gray-100 hover:bg-gray-50 transition" data-audio-id="${a.id}">
                    <input type="checkbox" 
                           ${selected.has(a.id) ? 'checked' : ''}
                           onchange="toggleAudioManagerSelection(${courseId}, ${a.id}, this.checked)"
                           class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500 flex-shrink-0"
                    >
                    <div class="flex-1 min-w-0">
                        <div class="font-medium text-gray-800 truncate">${a.title}</div>
                        <div class="text-sm text-gray-500">${a.original_name || ''} · ${formatDuration(a.duration || 0)}</div>
                    </div>
                    <button onclick="deleteAudioFileFromManager(${a.id}, ${courseId})" 
                            class="text-red-500 hover:text-red-700 px-2 py-1 rounded hover:bg-red-50 transition flex-shrink-0"
                            title="删除">
                        🗑️ 删除
                    </button>
                </div>
            `).join('');

            updateAudioManagerBatchButton(courseId);
        }

        // 切换选中
        function toggleAudioManagerSelection(courseId, audioId, checked) {
            if (!audioSelection[courseId]) audioSelection[courseId] = new Set();
            const selected = audioSelection[courseId];
            if (checked) selected.add(audioId);
            else selected.delete(audioId);

            updateAudioManagerBatchButton(courseId);
            updateAudioManagerSelectAll(courseId);
        }

        // 全选/取消全选
        function toggleAudioManagerSelectAll(checked) {
            if (!currentAudioManagerCourseId) return;
            const courseId = currentAudioManagerCourseId;
            if (!audioSelection[courseId]) audioSelection[courseId] = new Set();
            const selected = audioSelection[courseId];

            const listEl = document.getElementById('audio-manager-list');
            const checkboxes = listEl.querySelectorAll('input[type="checkbox"]:not([id="audio-manager-select-all"])');
            checkboxes.forEach(cb => {
                cb.checked = checked;
                const row = cb.closest('[data-audio-id]');
                if (row) {
                    const id = parseInt(row.dataset.audioId);
                    if (checked) selected.add(id);
                    else selected.delete(id);
                }
            });

            updateAudioManagerBatchButton(courseId);
        }

        // 更新批量删除按钮状态
        function updateAudioManagerBatchButton(courseId) {
            const selected = audioSelection[courseId] || new Set();
            const btn = document.getElementById('audio-manager-batch-btn');
            btn.textContent = `批量删除 (${selected.size})`;
            btn.disabled = selected.size === 0;
            if (selected.size === 0) {
                btn.classList.add('opacity-50');
            } else {
                btn.classList.remove('opacity-50');
            }
        }

        // 更新全选框状态
        function updateAudioManagerSelectAll(courseId) {
            const data = CourseAPI.getDetail(courseId);
            // 异步，简化处理
        }

        // 从管理弹窗删除单个音频
        async function deleteAudioFileFromManager(audioId, courseId) {
            if (!confirm('确定要删除这个音频文件吗？此操作不可恢复。')) return;

            try {
                const resp = await fetch(`${API_BASE}/api/upload/audio/${audioId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('access_token')}` }
                });
                const data = await resp.json();
                
                if (resp.ok) {
                    if (audioSelection[courseId]) audioSelection[courseId].delete(audioId);
                    // 刷新弹窗列表
                    const courseData = await CourseAPI.getDetail(courseId);
                    const audios = courseData.course?.audio_files || [];
                    document.getElementById('audio-manager-count').textContent = `共 ${audios.length} 个音频`;
                    if (audios.length === 0) {
                        document.getElementById('audio-manager-list').innerHTML = '<div class="text-center py-8 text-gray-400">暂无音频文件</div>';
                    } else {
                        renderAudioManagerList(courseId, audios);
                    }
                    // 刷新课程卡片
                    loadAdminCourses();
                } else {
                    alert(data.error || '删除失败');
                }
            } catch (err) {
                alert('删除请求失败: ' + err.message);
            }
        }

        // 批量删除音频（从弹窗）
        async function batchDeleteFromManager() {
            const courseId = currentAudioManagerCourseId;
            if (!courseId) return;
            const selected = audioSelection[courseId];
            if (!selected || selected.size === 0) {
                alert('请先选择要删除的音频文件');
                return;
            }
            const ids = Array.from(selected);
            if (!confirm(`确定要删除选中的 ${ids.length} 个音频文件吗？此操作不可恢复。`)) return;

            try {
                const resp = await fetch(`${API_BASE}/api/upload/audio/batch`, {
                    method: 'DELETE',
                    headers: { 
                        'Authorization': `Bearer ${localStorage.getItem('access_token')}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ audio_ids: ids })
                });
                const data = await resp.json();
                
                if (resp.ok) {
                    audioSelection[courseId] = new Set();
                    document.getElementById('audio-manager-select-all').checked = false;
                    // 刷新弹窗列表
                    const courseData = await CourseAPI.getDetail(courseId);
                    const audios = courseData.course?.audio_files || [];
                    document.getElementById('audio-manager-count').textContent = `共 ${audios.length} 个音频`;
                    if (audios.length === 0) {
                        document.getElementById('audio-manager-list').innerHTML = '<div class="text-center py-8 text-gray-400">暂无音频文件</div>';
                    } else {
                        renderAudioManagerList(courseId, audios);
                    }
                    loadAdminCourses();
                    if (data.errors && data.errors.length > 0) {
                        alert(`删除完成：${data.deleted?.length || 0} 个成功，${data.errors.length} 个失败\n${data.errors.join('\n')}`);
                    }
                } else {
                    alert(data.error || '批量删除失败');
                }
            } catch (err) {
                alert('删除请求失败: ' + err.message);
            }
        }

        // 兼容旧函数（如果其他地方调用）
        async function loadAudioFiles(courseId) {
            const course = adminCourses.find(c => c.id === courseId);
            openAudioManager(courseId, course?.title || '课程音频管理');
        }
        async function deleteAudioFile(audioId, courseId) {
            return deleteAudioFileFromManager(audioId, courseId);
        }
        async function batchDeleteAudioFiles(courseId) {
            return batchDeleteFromManager();
        }
        function toggleSelectAll(courseId, checked) {
            if (courseId === currentAudioManagerCourseId) {
                toggleAudioManagerSelectAll(checked);
            }
        }
        function toggleAudioSelection(courseId, audioId, checked) {
            if (courseId === currentAudioManagerCourseId) {
                toggleAudioManagerSelection(courseId, audioId, checked);
            }
        }

        function updateUploadCourseSelect(courses) {
            const select = document.getElementById('upload-course-select');
            select.innerHTML = '<option value="">-- 请选择课程 --</option>' +
                courses.map(c => `<option value="${c.id}">${c.title} (${c.category})</option>`).join('');
        }

        // 课程模态框
        function showCourseModal(course = null) {
            const modal = document.getElementById('course-modal');
            const form = document.getElementById('course-form');
            document.getElementById('modal-title').textContent = course ? '编辑课程' : '新建课程';
            document.getElementById('course-id').value = course ? course.id : '';
            document.getElementById('course-title-input').value = course ? course.title : '';
            document.getElementById('course-category-input').value = course ? course.category : '';
            document.getElementById('course-desc-input').value = course ? course.description || '' : '';
            document.getElementById('cover-preview').classList.add('hidden');
            document.getElementById('course-cover-input').value = '';
            modal.classList.remove('hidden');
        }

        function closeCourseModal() {
            document.getElementById('course-modal').classList.add('hidden');
        }

        async function editCourse(id) {
            try {
                const data = await CourseAPI.getDetail(id);
                showCourseModal(data.course);
            } catch (err) {
                alert(err.message);
            }
        }

        async function deleteCourse(id) {
            if (!confirm('确定要删除此课程吗？关联的音频文件也会被删除。')) return;
            try {
                await CourseAPI.delete(id);
                alert('删除成功');
                loadAdminCourses();
            } catch (err) {
                alert(err.message);
            }
        }

        // 封面预览
        document.getElementById('course-cover-input')?.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById('cover-preview').src = e.target.result;
                    document.getElementById('cover-preview').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        // 课程表单提交
        document.getElementById('course-form')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const courseId = document.getElementById('course-id').value;
            const data = {
                title: document.getElementById('course-title-input').value,
                category: document.getElementById('course-category-input').value,
                description: document.getElementById('course-desc-input').value
            };

            // 上传封面
            const coverFile = document.getElementById('course-cover-input').files[0];
            if (coverFile) {
                try {
                    const coverData = await UploadAPI.uploadCover(coverFile);
                    data.cover_image = coverData.url;
                } catch (err) {
                    console.warn('封面上传失败:', err);
                }
            }

            try {
                if (courseId) {
                    await CourseAPI.update(courseId, data);
                } else {
                    await CourseAPI.create(data);
                }
                closeCourseModal();
                loadAdminCourses();
            } catch (err) {
                alert(err.message);
            }
        });

        // 上传功能
        function setupUpload() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

            if (!isMobile) {
                // 桌面端：拖拽 + 多选
                const dropZone = document.getElementById('drop-zone');
                const fileInput = document.getElementById('file-input-desktop');

                dropZone.addEventListener('click', () => fileInput.click());

                ['dragenter', 'dragover'].forEach(event => {
                    dropZone.addEventListener(event, (e) => {
                        e.preventDefault();
                        dropZone.classList.add('border-blue-500', 'bg-blue-50');
                    });
                });
                ['dragleave', 'drop'].forEach(event => {
                    dropZone.addEventListener(event, (e) => {
                        e.preventDefault();
                        dropZone.classList.remove('border-blue-500', 'bg-blue-50');
                    });
                });
                dropZone.addEventListener('drop', (e) => {
                    const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('audio/'));
                    addFiles(files);
                });

                fileInput.addEventListener('change', (e) => {
                    addFiles(Array.from(e.target.files));
                    e.target.value = '';
                });
            } else {
                // 移动端：每次动态创建单选input，多次累积
                const mobileBtn = document.getElementById('mobile-add-btn');
                mobileBtn.addEventListener('click', () => {
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = 'audio/*';
                    input.style.display = 'none';
                    document.body.appendChild(input);

                    input.addEventListener('change', (e) => {
                        if (e.target.files.length > 0) {
                            addFiles(Array.from(e.target.files));
                        }
                        // 移除临时input
                        setTimeout(() => {
                            if (input.parentNode) input.parentNode.removeChild(input);
                        }, 100);
                    });

                    input.click();
                });
            }
        }

        function addFiles(files) {
            selectedFiles = [...selectedFiles, ...files];
            renderFileList();
            // 显示清空按钮
            document.getElementById('clear-btn').classList.remove('hidden');
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            renderFileList();
            if (selectedFiles.length === 0) {
                document.getElementById('clear-btn').classList.add('hidden');
            }
        }

        function clearAllFiles() {
            selectedFiles = [];
            renderFileList();
            document.getElementById('clear-btn').classList.add('hidden');
            document.getElementById('upload-result').classList.add('hidden');
        }

        function renderFileList() {
            const container = document.getElementById('file-list');
            const items = document.getElementById('file-items');
            if (selectedFiles.length === 0) {
                container.classList.add('hidden');
                document.getElementById('upload-progress-area').classList.add('hidden');
                return;
            }
            container.classList.remove('hidden');
            document.getElementById('upload-progress-area').classList.add('hidden');
            items.innerHTML = selectedFiles.map((file, i) => `
                <div class="flex items-center bg-gray-50 rounded-lg p-3" id="file-row-${i}">
                    <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-sm mr-3 flex-shrink-0">${i + 1}</div>
                    <div class="flex-1 min-w-0">
                        <input type="text" placeholder="音频标题（默认：${file.name.replace(/\.[^.]+$/, '')}）"
                               class="w-full px-2 py-1 text-sm border rounded focus:outline-none focus:ring-1 focus:ring-blue-500 mb-1"
                               id="file-title-${i}">
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-gray-400">${formatFileSize(file.size)}</span>
                            <div class="flex-1 bg-gray-200 rounded-full h-1.5 overflow-hidden hidden" id="file-progress-wrap-${i}">
                                <div class="bg-green-500 h-1.5 rounded-full transition-all duration-200" id="file-progress-bar-${i}" style="width: 0%"></div>
                            </div>
                            <span class="text-xs text-green-600 hidden" id="file-progress-text-${i}">0%</span>
                        </div>
                    </div>
                    <button onclick="removeFile(${i})" class="text-red-500 hover:text-red-700 px-2 ml-2 flex-shrink-0">×</button>
                </div>
            `).join('');
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        async function uploadFiles() {
            const courseId = document.getElementById('upload-course-select').value;
            if (!courseId) {
                alert('请先选择课程');
                return;
            }
            if (selectedFiles.length === 0) {
                alert('请选择要上传的文件');
                return;
            }

            const btn = document.querySelector('#file-list button:last-child');
            btn.disabled = true;
            btn.textContent = '上传中...';
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            // 显示进度区域
            const progressArea = document.getElementById('upload-progress-area');
            progressArea.classList.remove('hidden');
            document.getElementById('upload-result').classList.add('hidden');

            // 显示每个文件的进度条
            selectedFiles.forEach((_, i) => {
                const wrap = document.getElementById(`file-progress-wrap-${i}`);
                const text = document.getElementById(`file-progress-text-${i}`);
                if (wrap) wrap.classList.remove('hidden');
                if (text) text.classList.remove('hidden');
            });

            const titles = selectedFiles.map((_, i) => document.getElementById(`file-title-${i}`)?.value || '');

            // 进度回调
            const onProgress = (e) => {
                // 总进度
                const bar = document.getElementById('upload-progress-bar');
                const text = document.getElementById('upload-progress-text');
                const speedEl = document.getElementById('upload-speed');
                const fileInfo = document.getElementById('upload-file-info');

                if (bar) bar.style.width = `${e.percent}%`;
                if (text) text.textContent = `${e.percent}%`;
                if (speedEl) speedEl.textContent = e.speed > 0 ? `${formatFileSize(e.speed)}/s` : '';
                if (fileInfo) fileInfo.textContent = `${e.fileIndex + 1}/${e.fileCount} ${e.fileName}`;

                // 单个文件进度（估算）
                const fileBar = document.getElementById(`file-progress-bar-${e.fileIndex}`);
                const fileText = document.getElementById(`file-progress-text-${e.fileIndex}`);
                // 估算当前文件的完成百分比
                const fileSize = selectedFiles[e.fileIndex]?.size || 1;
                let cumulativeBefore = 0;
                for (let j = 0; j < e.fileIndex; j++) {
                    cumulativeBefore += selectedFiles[j]?.size || 0;
                }
                const fileLoaded = Math.max(0, e.loaded - cumulativeBefore);
                const filePercent = Math.min(100, Math.round((fileLoaded / fileSize) * 100));
                if (fileBar) fileBar.style.width = `${filePercent}%`;
                if (fileText) fileText.textContent = `${filePercent}%`;

                // 之前完成的文件设为 100%
                for (let j = 0; j < e.fileIndex; j++) {
                    const prevBar = document.getElementById(`file-progress-bar-${j}`);
                    const prevText = document.getElementById(`file-progress-text-${j}`);
                    if (prevBar) prevBar.style.width = '100%';
                    if (prevText) prevText.textContent = '完成';
                }
            };

            try {
                const result = await UploadAPI.uploadAudio(selectedFiles, courseId, titles, onProgress);

                // 所有文件设为 100%
                selectedFiles.forEach((_, i) => {
                    const bar = document.getElementById(`file-progress-bar-${i}`);
                    const text = document.getElementById(`file-progress-text-${i}`);
                    if (bar) bar.style.width = '100%';
                    if (text) text.textContent = '完成';
                });
                document.getElementById('upload-progress-bar').style.width = '100%';
                document.getElementById('upload-progress-text').textContent = '100%';

                document.getElementById('upload-result').classList.remove('hidden');
                document.getElementById('upload-result').innerHTML = `
                    <div class="bg-green-50 border border-green-200 rounded-lg p-4 text-green-800">
                        <p class="font-medium">上传成功！</p>
                        <p class="text-sm mt-1">成功上传 ${result.uploaded?.length || 0} 个文件</p>
                        ${result.errors?.length ? `<p class="text-sm text-red-600 mt-1">失败: ${result.errors.join(', ')}</p>` : ''}
                    </div>
                `;
                selectedFiles = [];
                document.getElementById('file-list').classList.add('hidden');
                progressArea.classList.add('hidden');
                loadAdminCourses();
            } catch (err) {
                document.getElementById('upload-result').classList.remove('hidden');
                document.getElementById('upload-result').innerHTML = `
                    <div class="bg-red-50 border border-red-200 rounded-lg p-4 text-red-800">上传失败: ${err.message}</div>
                `;
            } finally {
                btn.disabled = false;
                btn.textContent = '开始上传';
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        // OpenClaw Token 管理已移至 /settings.html
    </script>
    <!-- 音频管理弹窗 -->
    <div id="audio-manager-modal" class="hidden fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" onclick="closeAudioManager()"></div>
        <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
            <div class="relative transform overflow-hidden rounded-lg bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-4xl">
                <div class="bg-gray-50 px-4 py-3 sm:px-6 flex items-center justify-between border-b border-gray-200">
                    <div>
                        <h3 class="text-lg font-semibold leading-6 text-gray-900" id="audio-manager-title">课程音频管理</h3>
                        <p class="text-sm text-gray-500 mt-0.5" id="audio-manager-count">共 0 个音频</p>
                    </div>
                    <button onclick="closeAudioManager()" class="text-gray-400 hover:text-gray-600 transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
                <div class="px-4 py-3 sm:px-6 bg-white border-b border-gray-100 flex items-center justify-between">
                    <label class="flex items-center gap-2 cursor-pointer select-none">
                        <input type="checkbox" id="audio-manager-select-all"
                               onchange="toggleAudioManagerSelectAll(this.checked)"
                               class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                        <span class="text-sm font-medium text-gray-700">全选</span>
                    </label>
                    <button id="audio-manager-batch-btn" onclick="batchDeleteFromManager()" 
                            class="text-sm px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition opacity-50" disabled>
                        批量删除 (0)
                    </button>
                </div>
                <div id="audio-manager-list" class="max-h-[60vh] overflow-y-auto">
                    <div class="text-center py-8 text-gray-400">加载中...</div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 flex justify-end border-t border-gray-200">
                    <button onclick="closeAudioManager()" class="text-sm px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition">
                        关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
