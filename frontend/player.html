<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>播放器 - 音频学习平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        /* 移动端大按钮 */
        .btn-large { min-width: 44px; min-height: 44px; }
        .btn-play-large { min-width: 64px; min-height: 64px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="/" class="text-xl font-bold text-blue-600 hover:text-blue-700">🎧 音频学习平台</a>
                <div class="flex items-center space-x-4">
                    <a href="/favorites.html" class="text-gray-600 hover:text-blue-600 text-sm">我的收藏</a>
                    <a href="/analyze.html" class="text-gray-600 hover:text-blue-600 text-sm">学习分析</a>
                    <div id="nav-user"></div>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- 课程信息 -->
        <div class="mb-8 text-center">
            <span id="course-category" class="inline-block px-3 py-1 bg-blue-100 text-blue-700 text-sm rounded-full mb-3"></span>
            <h1 id="course-title" class="text-3xl font-bold text-gray-900">加载中...</h1>
            <p id="course-desc" class="text-gray-500 mt-2 line-clamp-2 max-w-2xl mx-auto"></p>
        </div>

        <!-- 主播放器 -->
        <div class="bg-white rounded-2xl shadow-lg p-6 sm:p-10 mb-8">
            <div class="text-center mb-6">
                <div class="text-gray-400 text-sm mb-2" id="current-index">0 / 0</div>
                <div class="flex items-center justify-center gap-2">
                    <h2 id="current-title" class="text-xl sm:text-2xl font-semibold text-gray-800">未选择音频</h2>
                    <button id="fav-btn" onclick="toggleFavorite()" class="p-2 rounded-full hover:bg-gray-100 transition text-gray-400" title="收藏">
                        <svg id="fav-icon-empty" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
                        <svg id="fav-icon-filled" class="w-6 h-6 hidden text-red-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    </button>
                </div>
            </div>

            <!-- 原生audio隐藏，只用自定义控件 -->
            <audio id="main-audio" class="hidden" preload="metadata"></audio>

            <!-- 进度条 -->
            <div id="progress-bar" class="w-full h-3 bg-gray-200 rounded-full cursor-pointer mb-3 relative touch-manipulation">
                <div id="progress-fill" class="h-full bg-blue-500 rounded-full transition-all" style="width: 0%"></div>
            </div>
            <div class="flex justify-between text-sm text-gray-500 mb-8">
                <span id="time-current">00:00</span>
                <span id="time-total">00:00</span>
            </div>

            <!-- 播放控制 -->
            <div class="flex items-center justify-center gap-6 sm:gap-10 mb-6">
                <button onclick="playPrev()" class="btn-large p-3 rounded-full bg-gray-100 hover:bg-gray-200 transition text-gray-700">
                    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button id="play-btn" onclick="togglePlay()" class="btn-play-large p-4 rounded-full bg-blue-600 hover:bg-blue-700 transition text-white shadow-lg shadow-blue-200">
                    <svg id="play-icon" class="w-10 h-10" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pause-icon" class="w-10 h-10 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button onclick="playNext()" class="btn-large p-3 rounded-full bg-gray-100 hover:bg-gray-200 transition text-gray-700">
                    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>

            <!-- 倍速选择 -->
            <div class="flex justify-center gap-2 flex-wrap">
                <button onclick="setSpeed(0.5)" class="speed-btn px-4 py-2 rounded-full text-sm font-medium bg-gray-100 text-gray-600 hover:bg-gray-200 transition" data-speed="0.5">0.5x</button>
                <button onclick="setSpeed(0.75)" class="speed-btn px-4 py-2 rounded-full text-sm font-medium bg-gray-100 text-gray-600 hover:bg-gray-200 transition" data-speed="0.75">0.75x</button>
                <button onclick="setSpeed(1)" class="speed-btn px-4 py-2 rounded-full text-sm font-medium bg-blue-600 text-white hover:bg-blue-700 transition shadow-sm" data-speed="1">1.0x</button>
                <button onclick="setSpeed(1.25)" class="speed-btn px-4 py-2 rounded-full text-sm font-medium bg-gray-100 text-gray-600 hover:bg-gray-200 transition" data-speed="1.25">1.25x</button>
                <button onclick="setSpeed(1.5)" class="speed-btn px-4 py-2 rounded-full text-sm font-medium bg-gray-100 text-gray-600 hover:bg-gray-200 transition" data-speed="1.5">1.5x</button>
                <button onclick="setSpeed(2)" class="speed-btn px-4 py-2 rounded-full text-sm font-medium bg-gray-100 text-gray-600 hover:bg-gray-200 transition" data-speed="2">2.0x</button>
            </div>
        </div>

        <!-- 音频列表 -->
        <div>
            <h3 class="text-xl font-semibold text-gray-800 mb-4">📋 课程音频列表</h3>
            <div id="playlist" class="bg-white rounded-xl shadow-md p-4 max-h-[500px] overflow-y-auto space-y-2">
                <div class="text-gray-400 text-center py-10">加载中...</div>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/player.js"></script>
</body>
</html>
